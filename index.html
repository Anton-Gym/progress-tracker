<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FormTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg:       #0B1120;
  --bg2:      #111827;
  --bg3:      #1E293B;
  --bg4:      #243044;
  --accent:   #14B8A6;
  --accent2:  #0d9488;
  --accentbg: rgba(20,184,166,0.12);
  --accentbg2:rgba(20,184,166,0.22);
  --text:     #F1F5F9;
  --muted:    #94A3B8;
  --hint:     #475569;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.13);
  --green:    #4ADE80;
  --greenbg:  rgba(74,222,128,0.12);
  --red:      #F87171;
  --redbg:    rgba(248,113,113,0.12);
  --amber:    #FBBF24;
  --amberbg:  rgba(251,191,36,0.12);
  --radius:   14px;
  --radius-sm:8px;
  --radius-xs:5px;
  --nav-h:    64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
input,button,select,textarea{font-family:inherit}

/* ── Screens ── */
.screen{display:none;height:100vh;overflow:hidden;flex-direction:column}
.screen.active{display:flex}

/* ── Auth screen ── */
#screen-auth{align-items:center;justify-content:center;padding:2rem 1.5rem}
.auth-logo{text-align:center;margin-bottom:2.5rem;position:relative}
.pulse-ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:pulse 2.5s ease-out infinite}
.pulse-ring:nth-child(2){animation-delay:.8s}
.logo-icon{position:relative;z-index:1;width:64px;height:64px;background:var(--accentbg2);border:1.5px solid var(--accent);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:28px}
.logo-name{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.logo-name span{color:var(--accent)}
.logo-tagline{font-size:13px;color:var(--muted);margin-top:3px}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(.7);opacity:.5}100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
.auth-card{width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:1.75rem}
.auth-tabs{display:flex;background:var(--bg3);border-radius:var(--radius-sm);padding:3px;margin-bottom:1.5rem}
.auth-tab{flex:1;padding:8px;text-align:center;border-radius:var(--radius-xs);font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:transparent;transition:.15s}
.auth-tab.active{background:var(--bg4);color:var(--text)}
.field{margin-bottom:1rem}
.field label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.field input{width:100%;height:44px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);padding:0 14px;font-size:15px;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--accent)}
.auth-btn{width:100%;height:46px;background:var(--accent);color:#0B1120;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;margin-top:.5rem;transition:background .15s}
.auth-btn:hover{background:var(--accent2)}
.auth-error{background:var(--redbg);color:var(--red);border:1px solid rgba(248,113,113,.25);border-radius:var(--radius-xs);padding:9px 12px;font-size:13px;margin-bottom:1rem;display:none}

/* ── App layout ── */
#screen-app{background:var(--bg)}
.app-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 1rem;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.app-header-left{display:flex;align-items:center;gap:10px}
.app-logo-sm{width:30px;height:30px;background:var(--accentbg2);border:1px solid var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.app-header-title{font-size:16px;font-weight:700;letter-spacing:-.01em}
.app-header-title span{color:var(--accent)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accentbg2);border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer;flex-shrink:0}
.page-area{flex:1;overflow-y:auto;padding:1rem 1rem calc(var(--nav-h) + 1rem);-webkit-overflow-scrolling:touch}
.bottom-nav{height:var(--nav-h);background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:stretch;flex-shrink:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--hint);cursor:pointer;font-size:10px;font-weight:500;letter-spacing:.02em;padding-bottom:4px;transition:color .15s}
.nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-item.active{color:var(--accent)}
.nav-item.active svg{stroke:var(--accent)}

/* ── Pages ── */
.page{display:none}.page.active{display:block}

/* ── Cards ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:.875rem}
.card-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:1rem}

/* ── Metric grid ── */
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:.875rem}
.metric-card{background:var(--bg3);border-radius:var(--radius-sm);padding:1rem}
.metric-label{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.metric-value{font-size:28px;font-weight:700;line-height:1;letter-spacing:-.02em}
.metric-unit{font-size:14px;font-weight:400;color:var(--muted)}
.metric-delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;margin-top:6px}
.delta-good{background:var(--greenbg);color:var(--green)}
.delta-bad{background:var(--redbg);color:var(--red)}
.delta-neu{background:var(--bg4);color:var(--muted)}

/* ── Measurement rows ── */
.meas-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:380px){.meas-grid{grid-template-columns:1fr}}
.mrow{background:var(--bg3);border-radius:var(--radius-sm);padding:9px 12px;display:flex;justify-content:space-between;align-items:center}
.mrow-name{font-size:12px;color:var(--muted);font-weight:500}
.mrow-right{text-align:right}
.mrow-val{font-size:15px;font-weight:700}
.mrow-deltas{display:flex;gap:4px;justify-content:flex-end;margin-top:3px}
.dbadge{font-size:10px;font-weight:600;padding:1px 5px;border-radius:10px}

/* ── Section header ── */
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}
.sec-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sec-hint{font-size:10px;color:var(--hint)}

/* ── Form ── */
.form-block{margin-bottom:1.25rem}
.form-block-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-bottom:.625rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.fields-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ifield{display:flex;flex-direction:column;gap:4px}
.ifield label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ifield input{height:40px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);padding:0 12px;font-size:14px;outline:none;transition:border-color .15s}
.ifield input:focus{border-color:var(--accent)}
.ifield input[type=date]{color-scheme:dark}
.save-btn{width:100%;height:46px;background:var(--accent);color:#0B1120;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;margin-top:1rem;transition:opacity .15s}
.save-btn:hover{opacity:.88}
.ghost-btn{height:40px;padding:0 16px;background:transparent;border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
.ghost-btn:hover{border-color:var(--border2);color:var(--text);background:var(--bg3)}

/* ── Chart ── */
.chart-wrap{position:relative;height:220px}

/* ── History ── */
.h-list{display:flex;flex-direction:column;gap:6px}
.h-row{background:var(--bg3);border-radius:var(--radius-sm);padding:10px 12px;display:flex;align-items:flex-start;gap:10px}
.h-date{font-size:13px;font-weight:700;min-width:76px;padding-top:1px;flex-shrink:0}
.h-tags{flex:1;display:flex;flex-wrap:wrap;gap:4px}
.htag{background:var(--bg4);border:1px solid var(--border);padding:2px 7px;border-radius:10px;font-size:11px;color:var(--muted)}
.h-del{background:none;border:none;cursor:pointer;color:var(--hint);font-size:16px;padding:0;flex-shrink:0;line-height:1}
.h-del:hover{color:var(--red)}
.start-pill{background:var(--accentbg);color:var(--accent);font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px;vertical-align:middle}

/* ── Photos ── */
.subtabs{display:flex;background:var(--bg3);border-radius:var(--radius-sm);padding:3px;margin-bottom:1rem}
.stab{flex:1;padding:7px 4px;text-align:center;border-radius:var(--radius-xs);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:transparent;transition:.15s}
.stab.active{background:var(--bg4);color:var(--text)}
.upload-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.uslot{aspect-ratio:3/4;border:1.5px dashed var(--border2);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;background:var(--bg3);transition:border-color .15s}
.uslot:hover{border-color:var(--accent)}
.uslot img{width:100%;height:100%;object-fit:cover}
.uslot-label{font-size:10px;color:var(--muted);margin-top:4px;font-weight:500;text-align:center}
.uslot-icon{font-size:22px;margin-bottom:4px}
.rm-btn{position:absolute;top:4px;right:4px;background:rgba(11,17,32,.85);border:1px solid var(--border2);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:12px;z-index:2}
.rm-btn:hover{color:var(--red)}
.photo-week-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;margin-bottom:.875rem}
.pw-ok{background:var(--greenbg);color:var(--green)}
.pw-warn{background:var(--amberbg);color:var(--amber)}
.compare-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.25rem}
.ccol-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;margin-bottom:6px}
.photo-row{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.photo-row img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;display:block}
.photo-empty{width:100%;aspect-ratio:3/4;background:var(--bg3);border:1px dashed var(--border2);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:11px}
.photo-angle{font-size:10px;color:var(--hint);text-align:center;margin-top:3px}
.tl-item{background:var(--bg3);border-radius:var(--radius-sm);padding:10px 12px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tl-item.tl-first{border:1px solid var(--accent)}
.tl-thumbs{display:flex;gap:3px;flex-shrink:0}
.tl-thumb{width:32px;height:42px;object-fit:cover;border-radius:4px}
.tl-empty{width:32px;height:42px;background:var(--bg4);border-radius:4px}
.tl-info{flex:1}
.tl-date{font-size:13px;font-weight:700}
.tl-sub{font-size:11px;color:var(--muted);margin-top:1px}

/* ── User menu ── */
.user-menu{position:fixed;top:56px;right:12px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:.75rem;z-index:200;min-width:180px;box-shadow:0 8px 32px rgba(0,0,0,.45);display:none}
.user-menu.open{display:block}
.um-name{font-size:14px;font-weight:700;margin-bottom:2px}
.um-sub{font-size:12px;color:var(--muted);margin-bottom:.75rem;padding-bottom:.75rem;border-bottom:1px solid var(--border)}
.um-btn{width:100%;text-align:left;background:none;border:none;color:var(--red);font-size:13px;font-weight:600;cursor:pointer;padding:4px 0}
.um-btn:hover{opacity:.8}

/* ── Empty ── */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:.75rem}
.empty-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:.5rem}
.empty-text{font-size:13px;line-height:1.6}

/* ── Toast ── */
#toast{position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#0B1120;font-size:13px;font-weight:700;padding:10px 20px;border-radius:20px;opacity:0;pointer-events:none;transition:.3s;z-index:300;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Banner ── */
.banner{padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:.875rem;line-height:1.5}
.banner-info{background:var(--accentbg);color:var(--accent);border:1px solid rgba(20,184,166,.25)}

/* ── Chart legend ── */
.chart-legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:.75rem}
.cl-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.cl-line{width:16px;height:2px;border-radius:1px;flex-shrink:0}

/* ── Divider ── */
.divider{border:none;border-top:1px solid var(--border);margin:1rem 0}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div class="screen active" id="screen-auth">
  <div class="auth-logo">
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="logo-icon">💪</div>
    <div class="logo-name">Form<span>Track</span></div>
    <div class="logo-tagline">Your personal progress, measured</div>
  </div>
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('login')">Sign in</button>
      <button class="auth-tab" onclick="switchAuthTab('register')">Create account</button>
    </div>
    <div id="auth-error" class="auth-error"></div>
    <div id="auth-form-login">
      <div class="field"><label>Name</label><input type="text" id="login-name" placeholder="Your name" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="login-pass" placeholder="Password" autocomplete="current-password"></div>
      <button class="auth-btn" onclick="doLogin()">Sign in</button>
    </div>
    <div id="auth-form-register" style="display:none">
      <div class="field"><label>Your name</label><input type="text" id="reg-name" placeholder="e.g. Sarah" autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" id="reg-pass" placeholder="Choose a password" autocomplete="new-password"></div>
      <div class="field"><label>Confirm password</label><input type="password" id="reg-pass2" placeholder="Repeat password" autocomplete="new-password"></div>
      <button class="auth-btn" onclick="doRegister()">Create account</button>
    </div>
  </div>
</div>

<!-- APP SCREEN -->
<div class="screen" id="screen-app">
  <div class="app-header">
    <div class="app-header-left">
      <div class="app-logo-sm">💪</div>
      <div class="app-header-title">Form<span>Track</span></div>
    </div>
    <div class="user-avatar" id="user-avatar" onclick="toggleUserMenu()"></div>
  </div>

  <div class="user-menu" id="user-menu">
    <div class="um-name" id="um-name"></div>
    <div class="um-sub" id="um-sub">Member</div>
    <button class="um-btn" onclick="doLogout()">Sign out</button>
  </div>

  <div class="page-area">
    <div class="page active" id="page-dashboard"></div>
    <div class="page" id="page-log"></div>
    <div class="page" id="page-photos"></div>
    <div class="page" id="page-charts"></div>
    <div class="page" id="page-history"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Dashboard
    </button>
    <button class="nav-item" onclick="showPage('log')" id="nav-log">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Log
    </button>
    <button class="nav-item" onclick="showPage('photos')" id="nav-photos">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Photos
    </button>
    <button class="nav-item" onclick="showPage('charts')" id="nav-charts">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Charts
    </button>
    <button class="nav-item" onclick="showPage('history')" id="nav-history">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      History
    </button>
  </nav>
</div>

<div id="toast"></div>

<!-- Hidden file inputs -->
<input type="file" id="file-front" accept="image/*" style="display:none">
<input type="file" id="file-side"  accept="image/*" style="display:none">
<input type="file" id="file-back"  accept="image/*" style="display:none">

<script>
// ─────────────────────────────────────────────
// DATA MODEL
// ─────────────────────────────────────────────
const FIELDS = [
  {key:'weight',    label:'Weight',           unit:'kg',  cat:'body', goodDown:true},
  {key:'bodyFat',   label:'Body fat',         unit:'%',   cat:'body', goodDown:true},
  {key:'leanMass',  label:'Lean body mass',   unit:'kg',  cat:'body', goodDown:false},
  {key:'bmi',       label:'BMI',              unit:'',    cat:'body', goodDown:true},
  {key:'skelMuscle',label:'Skeletal muscle',  unit:'kg',  cat:'body', goodDown:false},
  {key:'boneMass',  label:'Bone mass',        unit:'kg',  cat:'body', goodDown:false},
  {key:'bodyWater', label:'Body water',       unit:'%',   cat:'body', goodDown:false},
  {key:'chest',     label:'Chest',            unit:'cm',  cat:'meas', goodDown:true},
  {key:'stomach',   label:'Stomach',          unit:'cm',  cat:'meas', goodDown:true},
  {key:'waist',     label:'Waist',            unit:'cm',  cat:'meas', goodDown:true},
  {key:'seat',      label:'Seat',             unit:'cm',  cat:'meas', goodDown:true},
  {key:'leftBicep', label:'Left bicep',       unit:'cm',  cat:'meas', goodDown:false},
  {key:'rightBicep',label:'Right bicep',      unit:'cm',  cat:'meas', goodDown:false},
  {key:'leftForearm',label:'Left forearm',    unit:'cm',  cat:'meas', goodDown:false},
  {key:'rightForearm',label:'Right forearm',  unit:'cm',  cat:'meas', goodDown:false},
  {key:'leftThigh', label:'Left thigh',       unit:'cm',  cat:'meas', goodDown:false},
  {key:'rightThigh',label:'Right thigh',      unit:'cm',  cat:'meas', goodDown:false},
  {key:'leftCalf',  label:'Left calf',        unit:'cm',  cat:'meas', goodDown:false},
  {key:'rightCalf', label:'Right calf',       unit:'cm',  cat:'meas', goodDown:false},
  {key:'surfaceArea',label:'Surface area',    unit:'m²',  cat:'meas', goodDown:false},
];

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let currentUser  = null; // {name, key}
let entries      = [];
let photoSets    = [];
let pendingPhotos= {front:null,side:null,back:null};
let pendingPDate = '';
let photoSubTab  = 'compare';
let chartInst    = null;
let currentPage  = 'dashboard';

// ─────────────────────────────────────────────
// STORAGE HELPERS
// ─────────────────────────────────────────────
function usersDB(){ try{ return JSON.parse(localStorage.getItem('ft_users')||'{}'); }catch(e){return {};} }
function saveUsersDB(db){ localStorage.setItem('ft_users',JSON.stringify(db)); }

function uKey(name){ return 'ft_u_'+name.toLowerCase().replace(/\s+/g,'_'); }

function loadUserData(){
  const k = currentUser.key;
  try{ entries   = JSON.parse(localStorage.getItem(k+'_entries')||'[]'); }catch(e){entries=[];}
  try{ photoSets = JSON.parse(localStorage.getItem(k+'_photos') ||'[]'); }catch(e){photoSets=[];}
}
function saveEntries(){ localStorage.setItem(currentUser.key+'_entries', JSON.stringify(entries)); }
function savePhotos(){
  try{ localStorage.setItem(currentUser.key+'_photos', JSON.stringify(photoSets)); }
  catch(e){ toast('Storage full — delete old photo sets'); }
}

// ─────────────────────────────────────────────
// AUTH
// ─────────────────────────────────────────────
function switchAuthTab(t){
  document.querySelectorAll('.auth-tab').forEach((b,i)=>b.classList.toggle('active',['login','register'][i]===t));
  document.getElementById('auth-form-login').style.display    = t==='login'?'':'none';
  document.getElementById('auth-form-register').style.display = t==='register'?'':'none';
  document.getElementById('auth-error').style.display='none';
}

function authError(msg){ const el=document.getElementById('auth-error'); el.textContent=msg; el.style.display='block'; }

function doLogin(){
  const name=(document.getElementById('login-name').value||'').trim();
  const pass= document.getElementById('login-pass').value;
  if(!name||!pass){authError('Please fill in both fields.');return;}
  const db=usersDB();
  const key=uKey(name);
  if(!db[key]){authError('No account found. Create one first.');return;}
  if(db[key].pass!==btoa(pass)){authError('Wrong password.');return;}
  loginSuccess(name,key);
}

function doRegister(){
  const name=(document.getElementById('reg-name').value||'').trim();
  const pass= document.getElementById('reg-pass').value;
  const pass2=document.getElementById('reg-pass2').value;
  if(!name||!pass){authError('Please fill in all fields.');return;}
  if(pass!==pass2){authError("Passwords don't match.");return;}
  if(pass.length<4){authError('Password must be at least 4 characters.');return;}
  const db=usersDB(); const key=uKey(name);
  if(db[key]){authError('An account with that name already exists.');return;}
  db[key]={name,pass:btoa(pass),created:Date.now()};
  saveUsersDB(db);
  loginSuccess(name,key);
}

function loginSuccess(name,key){
  currentUser={name,key};
  localStorage.setItem('ft_session',JSON.stringify({name,key}));
  loadUserData();
  document.getElementById('user-avatar').textContent = name[0].toUpperCase();
  document.getElementById('um-name').textContent = name;
  document.getElementById('um-sub').textContent = 'Signed in';
  document.getElementById('screen-auth').classList.remove('active');
  document.getElementById('screen-app').classList.add('active');
  showPage('dashboard');
}

function doLogout(){
  localStorage.removeItem('ft_session');
  currentUser=null; entries=[]; photoSets=[];
  document.getElementById('screen-app').classList.remove('active');
  document.getElementById('screen-auth').classList.add('active');
  document.getElementById('user-menu').classList.remove('open');
  document.getElementById('login-name').value='';
  document.getElementById('login-pass').value='';
}

function toggleUserMenu(){
  document.getElementById('user-menu').classList.toggle('open');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#user-avatar')&&!e.target.closest('#user-menu'))
    document.getElementById('user-menu').classList.remove('open');
});

// ─────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────
function showPage(p){
  currentPage=p;
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.getElementById('nav-'+p).classList.add('active');
  document.getElementById('user-menu').classList.remove('open');
  render();
  document.querySelector('.page-area').scrollTop=0;
}

function render(){
  if(currentPage==='dashboard') renderDashboard();
  else if(currentPage==='log')  renderLog();
  else if(currentPage==='photos')  renderPhotos();
  else if(currentPage==='charts')  renderCharts();
  else if(currentPage==='history') renderHistory();
}

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function sorted(){ return [...entries].sort((a,b)=>a.date.localeCompare(b.date)); }
function sortedP(){ return [...photoSets].sort((a,b)=>a.date.localeCompare(b.date)); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ return new Date(d+'T12:00').toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'}); }
function weekOf(dateStr){
  const s=sorted(); if(!s.length) return 1;
  const first=new Date(s[0].date+'T12:00');
  const cur  =new Date(dateStr+'T12:00');
  return Math.floor((cur-first)/(7*24*60*60*1000))+1;
}
function isPhotoWeek(dateStr){ const w=weekOf(dateStr); return w===1||w%4===1; }

function deltaEl(cur,ref,f){
  if(cur==null||ref==null) return '';
  const d=+(cur-ref).toFixed(2); if(d===0) return `<span class="dbadge delta-neu">—</span>`;
  const sign=d>0?'+':''; const good=f.goodDown?d<0:d>0;
  return `<span class="dbadge ${good?'delta-good':'delta-bad'}">${sign}${d}${f.unit}</span>`;
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ─────────────────────────────────────────────
// DASHBOARD
// ─────────────────────────────────────────────
function renderDashboard(){
  const s=sorted();
  const first=s[0], latest=s[s.length-1], prev=s.length>1?s[s.length-2]:null;
  const isOnly=!latest||latest===first;
  const sp=sortedP(), latestP=sp.length?sp[sp.length-1]:null;

  let h=`<div style="padding:.25rem 0 .5rem"><span style="font-size:20px;font-weight:700;letter-spacing:-.02em">Hello, ${currentUser.name.split(' ')[0]} 👋</span><br><span style="font-size:13px;color:var(--muted)">${new Date().toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long'})}</span></div><div style="height:.875rem"></div>`;

  if(!s.length){
    h+=`<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-title">No data yet</div><div class="empty-text">Tap Log to add your first measurements.</div></div>`;
    document.getElementById('page-dashboard').innerHTML=h; return;
  }

  if(isOnly) h+=`<div class="banner banner-info">Your baseline is saved. Log weekly check-ins to see your progress.</div>`;

  // Key metrics
  h+=`<div class="card-title">Key stats</div><div class="metric-grid">`;
  [{key:'weight',label:'Weight'},{key:'bodyFat',label:'Body fat'},{key:'leanMass',label:'Lean mass'},{key:'waist',label:'Waist'}].forEach(km=>{
    const f=FIELDS.find(f=>f.key===km.key);
    const v=latest[f.key]; if(v==null) return;
    const fv=first[f.key];
    const d=fv!=null?+(v-fv).toFixed(2):null;
    const good=d!=null?(f.goodDown?d<0:d>0):null;
    const sign=d>0?'+':'';
    h+=`<div class="metric-card">
      <div class="metric-label">${km.label}</div>
      <div class="metric-value">${v}<span class="metric-unit"> ${f.unit}</span></div>
      ${d!=null?`<div class="metric-delta ${d===0?'delta-neu':good?'delta-good':'delta-bad'}">${d===0?'No change':sign+d.toFixed(1)+f.unit+' from start'}</div>`:''}
    </div>`;
  });
  h+=`</div>`;

  // All measurements
  h+=`<div class="card"><div class="sec-hdr"><div class="sec-title">All measurements</div>${prev&&!isOnly?'<div class="sec-hint">prev wk · start</div>':''}</div><div class="meas-grid">`;
  FIELDS.forEach(f=>{
    const v=latest[f.key]; if(v==null) return;
    h+=`<div class="mrow"><div class="mrow-name">${f.label}</div><div class="mrow-right">
      <div class="mrow-val">${v}${f.unit?'&thinsp;'+f.unit:''}</div>
      <div class="mrow-deltas">${prev&&!isOnly?deltaEl(v,prev[f.key],f):''}${!isOnly?deltaEl(v,first[f.key],f):''}</div>
    </div></div>`;
  });
  h+=`</div></div>`;

  // Photo preview
  if(latestP){
    h+=`<div class="card"><div class="sec-hdr"><div class="card-title" style="margin:0">Latest photos</div><span style="font-size:11px;color:var(--muted)">${fmtDate(latestP.date)}</span></div>
    <div class="photo-row" style="margin-top:.75rem">`;
    ['front','side','back'].forEach(a=>{
      h+=`<div>${latestP[a]?`<img src="${latestP[a]}" alt="${a}" style="border-radius:8px">`:`<div class="photo-empty">—</div>`}<div class="photo-angle">${a}</div></div>`;
    });
    h+=`</div></div>`;
  }

  document.getElementById('page-dashboard').innerHTML=h;
}

// ─────────────────────────────────────────────
// LOG STATS
// ─────────────────────────────────────────────
function renderLog(){
  let h=`<div class="form-block"><div class="form-block-title" style="color:var(--muted)">Date</div>
    <div class="ifield"><input type="date" id="inp-date" value="${todayStr()}" style="max-width:200px"></div>
  </div>
  <div class="form-block"><div class="form-block-title">Body composition</div><div class="fields-2">`;
  FIELDS.filter(f=>f.cat==='body').forEach(f=>{
    h+=`<div class="ifield"><label>${f.label}${f.unit?' ('+f.unit+')':''}</label><input type="number" id="inp-${f.key}" step="0.1" inputmode="decimal"></div>`;
  });
  h+=`</div></div><div class="form-block"><div class="form-block-title">Measurements (cm)</div><div class="fields-2">`;
  FIELDS.filter(f=>f.cat==='meas').forEach(f=>{
    h+=`<div class="ifield"><label>${f.label}</label><input type="number" id="inp-${f.key}" step="0.1" inputmode="decimal"></div>`;
  });
  h+=`</div></div><button class="save-btn" onclick="saveEntry()">Save entry</button><div style="height:.5rem"></div><button class="ghost-btn" onclick="clearLogForm()" style="width:100%">Clear all fields</button>`;
  document.getElementById('page-log').innerHTML=h;
}

function clearLogForm(){ FIELDS.forEach(f=>{const el=document.getElementById('inp-'+f.key);if(el)el.value='';}); }

function saveEntry(){
  const date=document.getElementById('inp-date').value;
  if(!date){toast('Pick a date first');return;}
  const entry={date}; let hasVal=false;
  FIELDS.forEach(f=>{const el=document.getElementById('inp-'+f.key);if(el&&el.value!==''){entry[f.key]=parseFloat(el.value);hasVal=true;}});
  if(!hasVal){toast('Enter at least one value');return;}
  const idx=entries.findIndex(e=>e.date===date);
  if(idx>=0) entries[idx]={...entries[idx],...entry}; else entries.push(entry);
  saveEntries(); toast('Entry saved ✓'); showPage('dashboard');
}

// ─────────────────────────────────────────────
// PHOTOS
// ─────────────────────────────────────────────
function renderPhotos(){
  const sp=sortedP();
  let h=`<div class="subtabs">
    <button class="stab ${photoSubTab==='compare'?'active':''}" onclick="setPhotoTab('compare')">Compare</button>
    <button class="stab ${photoSubTab==='add'?'active':''}" onclick="setPhotoTab('add')">Add photos</button>
    <button class="stab ${photoSubTab==='timeline'?'active':''}" onclick="setPhotoTab('timeline')">Timeline</button>
  </div>`;

  if(photoSubTab==='compare'){
    if(!sp.length){
      h+=`<div class="empty-state"><div class="empty-icon">📷</div><div class="empty-title">No photos yet</div><div class="empty-text">Add your first set every 4 weeks to track visual changes.</div></div>`;
    } else {
      const first=sp[0],latest=sp[sp.length-1],prev=sp.length>1?sp[sp.length-2]:null;
      const isOnly=latest.date===first.date;
      if(isOnly){
        h+=`<div class="banner banner-info">This is your baseline set. Add more sets every 4 weeks to compare.</div>`;
        h+=photoTrioCard(first,'Baseline · '+fmtDate(first.date));
      } else {
        h+=`<div class="card-title">Latest vs start</div><div class="compare-cols">${miniTrio(latest,'Latest')}${miniTrio(first,'Start')}</div>`;
        if(prev){h+=`<hr class="divider"><div class="card-title">Latest vs previous month</div><div class="compare-cols">${miniTrio(latest,'Latest')}${miniTrio(prev,'Previous')}</div>`;}
      }
    }
  } else if(photoSubTab==='add'){
    const date=pendingPDate||todayStr();
    const wk=entries.length?weekOf(date):1;
    const valid=isPhotoWeek(date);
    h+=`<div class="card">
      <p class="banner banner-info" style="margin-bottom:.875rem">Take photos every 4 weeks — front, side, and back — in the same spot and lighting each time.</p>
      <div class="ifield" style="max-width:200px;margin-bottom:.875rem"><label>Date</label><input type="date" id="photo-date" value="${date}" oninput="updatePDate(this.value)"></div>
      <div class="${valid?'pw-ok':'pw-warn'} photo-week-badge">${valid?'✓ Photo week':'⚠ Week '+wk+' — not a photo week'}</div>
      <div class="upload-grid">
        ${uSlot('front','Front')}${uSlot('side','Side')}${uSlot('back','Back')}
      </div>
      <button class="save-btn" onclick="savePhotoSet()">Save photo set</button>
      <div style="height:.5rem"></div>
      <button class="ghost-btn" onclick="clearPending()" style="width:100%">Clear</button>
    </div>`;
  } else {
    const sp2=[...sp].reverse();
    if(!sp2.length){h+=`<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-title">No sets yet</div></div>`;}
    else {
      sp2.forEach(set=>{
        const isFirst=set.date===sp[0].date;
        h+=`<div class="tl-item ${isFirst?'tl-first':''}">
          <div class="tl-thumbs">${['front','side','back'].map(a=>set[a]?`<img class="tl-thumb" src="${set[a]}" alt="${a}">`:`<div class="tl-empty"></div>`).join('')}</div>
          <div class="tl-info"><div class="tl-date">${fmtDate(set.date)}${isFirst?`<span class="start-pill">start</span>`:''}</div><div class="tl-sub">Week ${entries.length?weekOf(set.date):1}</div></div>
          ${!isFirst?`<button class="h-del" onclick="deletePhotoSet('${set.date}')" aria-label="Delete">🗑</button>`:''}
        </div>`;
      });
    }
  }

  document.getElementById('page-photos').innerHTML=h;
}

function photoTrioCard(set,title){
  return `<div class="card"><div class="sec-title" style="margin-bottom:.75rem">${title}</div><div class="photo-row">
    ${['front','side','back'].map(a=>`<div>${set[a]?`<img src="${set[a]}" alt="${a}" style="border-radius:8px">`:`<div class="photo-empty">—</div>`}<div class="photo-angle">${a}</div></div>`).join('')}
  </div></div>`;
}

function miniTrio(set,label){
  return `<div><div class="ccol-title">${label}<br><span style="font-size:9px;font-weight:400">${fmtDate(set.date)}</span></div>
    <div class="photo-row">${['front','side','back'].map(a=>`<div>${set[a]?`<img src="${set[a]}" alt="${a}">`:`<div class="photo-empty">—</div>`}<div class="photo-angle">${a}</div></div>`).join('')}</div>
  </div>`;
}

function uSlot(key,label){
  const img=pendingPhotos[key];
  if(img) return `<div><div class="uslot" onclick="triggerUpload('${key}')"><img src="${img}" alt="${key}"><button class="rm-btn" onclick="event.stopPropagation();removeP('${key}')">✕</button></div><div class="uslot-label">${label}</div></div>`;
  return `<div><div class="uslot" onclick="triggerUpload('${key}')"><div class="uslot-icon">📷</div><div style="font-size:10px;color:var(--muted)">${label}</div></div></div>`;
}

function setPhotoTab(t){ photoSubTab=t; renderPhotos(); }
function updatePDate(v){ pendingPDate=v; renderPhotos(); }
function triggerUpload(slot){ window._activeSlot=slot; document.getElementById('file-'+slot).click(); }
function removeP(slot){ pendingPhotos[slot]=null; renderPhotos(); }
function clearPending(){ pendingPhotos={front:null,side:null,back:null}; pendingPDate=''; renderPhotos(); }

function handleFile(e,slot){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{pendingPhotos[slot]=ev.target.result;renderPhotos();};
  r.readAsDataURL(file); e.target.value='';
}

function savePhotoSet(){
  const date=pendingPDate||todayStr();
  if(!pendingPhotos.front&&!pendingPhotos.side&&!pendingPhotos.back){toast('Add at least one photo');return;}
  const entry={date,...pendingPhotos};
  const idx=photoSets.findIndex(p=>p.date===date);
  if(idx>=0) photoSets[idx]=entry; else photoSets.push(entry);
  savePhotos(); pendingPhotos={front:null,side:null,back:null}; pendingPDate='';
  toast('Photos saved ✓'); photoSubTab='compare'; renderPhotos();
}

function deletePhotoSet(date){
  if(!confirm('Delete photo set for '+fmtDate(date)+'?')) return;
  photoSets=photoSets.filter(p=>p.date!==date); savePhotos(); renderPhotos();
}

// ─────────────────────────────────────────────
// CHARTS
// ─────────────────────────────────────────────
function renderCharts(){
  const s=sorted();
  if(s.length<2){
    document.getElementById('page-charts').innerHTML=`<div class="empty-state"><div class="empty-icon">📈</div><div class="empty-title">Not enough data</div><div class="empty-text">Add at least two entries to see your trends.</div></div>`;
    return;
  }
  const labels=s.map(e=>fmtDate(e.date));
  const defs=[
    {key:'weight',   label:'Weight (kg)',    color:'#14B8A6',dash:[]},
    {key:'bodyFat',  label:'Body fat (%)',   color:'#F87171',dash:[5,4]},
    {key:'waist',    label:'Waist (cm)',     color:'#FBBF24',dash:[3,3]},
    {key:'leanMass', label:'Lean mass (kg)', color:'#818CF8',dash:[8,3]},
  ];

  let legend=`<div class="chart-legend">`;
  defs.forEach(d=>{
    legend+=`<div class="cl-item"><div class="cl-line" style="background:${d.color};${d.dash.length?`background:none;border-top:2px dashed ${d.color}`:''};height:2px"></div>${d.label}</div>`;
  });
  legend+=`</div>`;

  document.getElementById('page-charts').innerHTML=`<div class="card">${legend}<div class="chart-wrap"><canvas id="mainChart"></canvas></div></div>`;

  if(chartInst){chartInst.destroy();chartInst=null;}
  chartInst=new Chart(document.getElementById('mainChart'),{
    type:'line',
    data:{labels,datasets:defs.map(d=>({
      label:d.label,data:s.map(e=>e[d.key]??null),
      borderColor:d.color,borderDash:d.dash,backgroundColor:'transparent',
      tension:.35,pointRadius:s.length>20?2:4,pointHoverRadius:6,spanGaps:true
    }))},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false,backgroundColor:'#1E293B',titleColor:'#F1F5F9',bodyColor:'#94A3B8',borderColor:'rgba(255,255,255,0.1)',borderWidth:1}},
      scales:{
        x:{ticks:{color:'#475569',maxTicksLimit:6,maxRotation:30,font:{size:10}},grid:{color:'rgba(255,255,255,0.05)'}},
        y:{ticks:{color:'#475569',font:{size:10}},grid:{color:'rgba(255,255,255,0.05)'}}
      }
    }
  });
}

// ─────────────────────────────────────────────
// HISTORY
// ─────────────────────────────────────────────
function renderHistory(){
  const s=[...sorted()].reverse();
  if(!s.length){
    document.getElementById('page-history').innerHTML=`<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-title">No entries yet</div></div>`;return;
  }
  const firstDate=sorted()[0].date;
  let h=`<div class="h-list">`;
  s.forEach(e=>{
    const isFirst=e.date===firstDate;
    h+=`<div class="h-row">
      <div class="h-date">${fmtDate(e.date)}${isFirst?`<span class="start-pill">start</span>`:''}</div>
      <div class="h-tags">`;
    FIELDS.forEach(f=>{if(e[f.key]!=null)h+=`<span class="htag">${f.label}: ${e[f.key]}${f.unit}</span>`;});
    h+=`</div>${!isFirst?`<button class="h-del" onclick="deleteEntry('${e.date}')" aria-label="Delete">🗑</button>`:''}</div>`;
  });
  h+=`</div>`;
  document.getElementById('page-history').innerHTML=h;
}

function deleteEntry(date){
  if(!confirm('Delete entry for '+fmtDate(date)+'?')) return;
  entries=entries.filter(e=>e.date!==date); saveEntries(); render();
}

// ─────────────────────────────────────────────
// FILE INPUTS
// ─────────────────────────────────────────────
document.getElementById('file-front').addEventListener('change',e=>handleFile(e,'front'));
document.getElementById('file-side' ).addEventListener('change',e=>handleFile(e,'side'));
document.getElementById('file-back' ).addEventListener('change',e=>handleFile(e,'back'));

// ─────────────────────────────────────────────
// AUTO-LOGIN
// ─────────────────────────────────────────────
(function init(){
  try{
    const sess=JSON.parse(localStorage.getItem('ft_session')||'null');
    if(sess&&sess.name&&sess.key){ loginSuccess(sess.name,sess.key); }
  }catch(e){}
})();
</script>
</body>
